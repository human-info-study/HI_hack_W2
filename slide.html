</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-class="slides" data-theme="2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc" lang="C" class="slides" data-marpit-pagination="7" style="--paginate:true;--class:slides;--theme:2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc;" data-marpit-pagination-total="61">
<h2 id="%E9%96%8B%E7%99%BA%E3%81%AF%E5%A4%A7%E5%85%83%E3%81%A8%E8%87%AA%E5%88%86%E3%81%AE%E4%BD%9C%E6%A5%AD%E9%83%A8%E5%B1%8B%E3%82%92%E5%88%86%E3%81%91%E3%82%8B">開発は「大元」と「自分の作業部屋」を分ける</h2>
<ul>
<li>main（発表に使う完成版の置き場）を直接いじらない</li>
<li>Branch（自分専用の安全な作業部屋）を作って作業する</li>
<li>Commit（変更のセーブポイント）で作業を記録する</li>
<li>Pull Request / PR（合体前の確認依頼）でmain（完成版の置き場）に入れる</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-class="slides" data-theme="2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc" lang="C" class="slides" data-marpit-pagination="8" style="--paginate:true;--class:slides;--theme:2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc;" data-marpit-pagination-total="61">
<h2 id="%E3%81%AA%E3%81%9Cmain%E5%AE%8C%E6%88%90%E7%89%88%E3%81%AE%E7%BD%AE%E3%81%8D%E5%A0%B4%E3%82%92%E7%9B%B4%E6%8E%A5%E3%81%84%E3%81%98%E3%82%89%E3%81%AA%E3%81%84%E3%81%AE%E3%81%8B">なぜmain（完成版の置き場）を直接いじらないのか</h2>
<p>main（完成版の置き場）を全員で同時に編集すると、壊れやすいから。</p>
<ul>
<li>誰かの変更を上書きしてしまう</li>
<li>動いていたアプリが急に壊れる</li>
<li>どの変更が原因かわからなくなる</li>
<li>同じ場所を編集してConflict（変更の衝突）が起きる</li>
</ul>
<p><strong>Branch（自分専用の安全な作業部屋）を使うと、完成版を守りながら作業できる。</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-class="slides" data-theme="2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc" lang="C" class="slides" data-marpit-pagination="9" style="--paginate:true;--class:slides;--theme:2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc;" data-marpit-pagination-total="61">
<h2 id="git%E5%A4%89%E6%9B%B4%E5%B1%A5%E6%AD%B4%E3%82%92%E6%AE%8B%E3%81%99%E9%81%93%E5%85%B7%E3%81%8C%E5%BF%85%E8%A6%81%E3%81%AA%E7%90%86%E7%94%B1">Git（変更履歴を残す道具）が必要な理由</h2>
<p>Git（変更履歴を残す道具）は、チームで安全に分担するために使う。</p>
<ul>
<li>誰が、いつ、何を変えたか残る</li>
<li>前の状態に戻せる</li>
<li>担当機能ごとにBranch（自分専用の安全な作業部屋）を分けられる</li>
<li>Pull Request / PR（合体前の確認依頼）で確認してからmain（完成版の置き場）に入れられる</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-class="slides" data-theme="2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc" lang="C" class="slides" data-marpit-pagination="10" style="--paginate:true;--class:slides;--theme:2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc;" data-marpit-pagination-total="61">
<h2 id="github%E3%83%8D%E3%83%83%E3%83%88%E4%B8%8A%E3%81%AE%E3%82%B3%E3%83%BC%E3%83%89%E7%BD%AE%E3%81%8D%E5%A0%B4%E3%81%8C%E5%BF%85%E8%A6%81%E3%81%AA%E7%90%86%E7%94%B1">GitHub（ネット上のコード置き場）が必要な理由</h2>
<p>GitHub（ネット上のコード置き場）は、チーム全員で同じコードを共有する場所。</p>
<ul>
<li>チームのコードを1か所に置ける</li>
<li>Pull Request / PR（合体前の確認依頼）で差分を見られる</li>
<li>Codespaces（ブラウザで開く開発用PC）を起動できる</li>
<li>家のPCでも学校PCでも同じコードにアクセスできる</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-marpit-scope-4CKxTLsi="" data-paginate="true" data-class="slides" data-theme="2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc" lang="C" class="slides" data-marpit-pagination="11" style="--paginate:true;--class:slides;--theme:2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc;" data-marpit-pagination-total="61">
<h1 id="mvp%E3%82%92%E6%B1%BA%E3%82%81%E3%82%8B">MVPを決める</h1>
<div class="section-outline">
  <div class="outline-item outline-muted">今日やること</div>
  <div class="outline-item outline-muted">まずは全体像</div>
  <div class="outline-item outline-current">MVPを決める</div>
  <div class="outline-item outline-muted">GitHubを用意する</div>
  <div class="outline-item outline-muted">Codespacesを開く</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-class="slides" data-theme="2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc" lang="C" class="slides" data-marpit-pagination="12" style="--paginate:true;--class:slides;--theme:2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc;" data-marpit-pagination-total="61">
<h2 id="mvp%E6%9C%80%E5%B0%8F%E9%99%90%E3%81%A0%E3%81%91%E3%81%A9%E4%BE%A1%E5%80%A4%E3%81%8C%E4%BC%9D%E3%82%8F%E3%82%8B%E5%BD%A2%E3%82%921%E3%81%A4%E3%81%AB%E7%B5%9E%E3%82%8B">MVP（最小限だけど価値が伝わる形）を1つに絞る</h2>
<p>MVP（最小限だけど価値が伝わる形）は、発表で30秒デモできる一番小さい流れ。</p>
<ul>
<li>最初から全部作らない</li>
<li>「誰の何の困りごとを解決するか」を残す</li>
<li>画面や機能を増やしすぎない</li>
<li>今週は「最初の1画面」か「最初の1機能」でよい</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-class="slides" data-theme="2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc" lang="C" class="slides" data-marpit-pagination="13" style="--paginate:true;--class:slides;--theme:2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc;" data-marpit-pagination-total="61">
<h2 id="mvp%E6%9C%80%E5%B0%8F%E9%99%90%E3%81%A0%E3%81%91%E3%81%A9%E4%BE%A1%E5%80%A4%E3%81%8C%E4%BC%9D%E3%82%8F%E3%82%8B%E5%BD%A2%E3%81%AE%E6%B1%BA%E3%82%81%E6%96%B9">MVP（最小限だけど価値が伝わる形）の決め方</h2>
<p>次の4つだけを決める。</p>
<ol>
<li>使う人は誰か</li>
<li>何に困っているか</li>
<li>最初に見せる画面は何か</li>
<li>最初にできる操作は何か</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-class="slides" data-theme="2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc" lang="C" class="slides" data-marpit-pagination="14" style="--paginate:true;--class:slides;--theme:2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc;" data-marpit-pagination-total="61">
<h2 id="mvp%E6%9C%80%E5%B0%8F%E9%99%90%E3%81%A0%E3%81%91%E3%81%A9%E4%BE%A1%E5%80%A4%E3%81%8C%E4%BC%9D%E3%82%8F%E3%82%8B%E5%BD%A2%E3%81%AE%E4%BE%8B">MVP（最小限だけど価値が伝わる形）の例</h2>
<p>例：履修相談アプリ</p>
<ul>
<li>使う人：履修登録で迷っている1年生</li>
<li>困りごと：先輩の意見が見つけにくい</li>
<li>最初の画面：授業一覧</li>
<li>最初の操作：授業を選ぶとコメントが見られる</li>
</ul>
<p><strong>Week 2で作るMVP（最小限だけど価値が伝わる形）：授業一覧 → 授業詳細 → コメント表示</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-marpit-scope-M5B64O2r="" data-paginate="true" data-class="slides" data-theme="2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc" lang="C" class="slides" data-marpit-pagination="15" style="--paginate:true;--class:slides;--theme:2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc;" data-marpit-pagination-total="61">
<h1 id="github%E3%82%92%E7%94%A8%E6%84%8F%E3%81%99%E3%82%8B">GitHubを用意する</h1>
<div class="section-outline">
  <div class="outline-item outline-muted">まずは全体像</div>
  <div class="outline-item outline-muted">MVPを決める</div>
  <div class="outline-item outline-current">GitHubを用意する</div>
  <div class="outline-item outline-muted">Codespacesを開く</div>
  <div class="outline-item outline-muted">自分の作業部屋を作る</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-class="slides" data-theme="2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc" lang="C" class="slides" data-marpit-pagination="16" style="--paginate:true;--class:slides;--theme:2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc;" data-marpit-pagination-total="61">
<h2 id="%E3%81%BE%E3%81%9Agithub%E3%83%8D%E3%83%83%E3%83%88%E4%B8%8A%E3%81%AE%E3%82%B3%E3%83%BC%E3%83%89%E7%BD%AE%E3%81%8D%E5%A0%B4%E3%81%AE%E3%82%A2%E3%82%AB%E3%82%A6%E3%83%B3%E3%83%88%E3%82%92%E4%BD%9C%E3%82%8B">まずGitHub（ネット上のコード置き場）のアカウントを作る</h2>
<p>GitHub（ネット上のコード置き場）を使うには、各自のアカウントが必要。</p>
<ol>
<li><a href="https://github.com">https://github.com</a> にアクセス</li>
<li>Sign up（アカウント登録）を押す</li>
<li>メールアドレスなどを入力する</li>
<li>GitHubユーザー名（GitHub上の名前）をチームに共有する</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-class="slides" data-theme="2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc" lang="C" class="slides" data-marpit-pagination="17" style="--paginate:true;--class:slides;--theme:2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc;" data-marpit-pagination-total="61">
<h2 id="%E4%BB%A3%E8%A1%A8%E8%80%85%E3%81%8Crepository%E3%83%81%E3%83%BC%E3%83%A0%E3%81%AE%E3%82%B3%E3%83%BC%E3%83%89%E7%AE%B1%E3%82%92%E4%BD%9C%E3%82%8B">代表者がRepository（チームのコード箱）を作る</h2>
<p>Repository（チームのコード箱）は、GitHub（ネット上のコード置き場）上でコードを入れる箱。</p>
<ol>
<li>New repository（新しいコード箱）を押す</li>
<li>Repository name（コード箱の名前）を決める</li>
<li>Private（チームだけが見られる設定）で作る</li>
<li>README（最初の説明ファイル）ありで作る</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-class="slides" data-theme="2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc" lang="C" class="slides" data-marpit-pagination="18" style="--paginate:true;--class:slides;--theme:2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc;" data-marpit-pagination-total="61">
<h2 id="collaborator%E5%85%B1%E5%90%8C%E7%B7%A8%E9%9B%86%E3%81%A7%E3%81%8D%E3%82%8B%E4%BA%BA%E3%81%AB%E3%83%81%E3%83%BC%E3%83%A0%E3%83%A1%E3%83%B3%E3%83%90%E3%83%BC%E3%82%92%E6%8B%9B%E5%BE%85%E3%81%99%E3%82%8B">Collaborator（共同編集できる人）にチームメンバーを招待する</h2>
<p>Collaborator（共同編集できる人）に入っていない人は、同じRepository（チームのコード箱）で作業できない。</p>
<ol>
<li>Settings（設定）を開く</li>
<li>Collaborators（共同編集できる人）を開く</li>
<li>Add people（人を追加）を押す</li>
<li>GitHubユーザー名（GitHub上の名前）で招待する</li>
<li>招待された人は承認する</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-marpit-scope-M6fZ8Ntz="" data-paginate="true" data-class="slides" data-theme="2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc" lang="C" class="slides" data-marpit-pagination="19" style="--paginate:true;--class:slides;--theme:2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc;" data-marpit-pagination-total="61">
<h1 id="codespaces%E3%82%92%E9%96%8B%E3%81%8F">Codespacesを開く</h1>
<div class="section-outline">
  <div class="outline-item outline-muted">MVPを決める</div>
  <div class="outline-item outline-muted">GitHubを用意する</div>
  <div class="outline-item outline-current">Codespacesを開く</div>
  <div class="outline-item outline-muted">自分の作業部屋を作る</div>
  <div class="outline-item outline-muted">少しだけ変更して記録する</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-class="slides" data-theme="2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc" lang="C" class="slides" data-marpit-pagination="20" style="--paginate:true;--class:slides;--theme:2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc;" data-marpit-pagination-total="61">
<h2 id="codespaces%E3%83%96%E3%83%A9%E3%82%A6%E3%82%B6%E3%81%A7%E9%96%8B%E3%81%8F%E9%96%8B%E7%99%BA%E7%94%A8pc%E3%82%92%E4%BD%BF%E3%81%86">Codespaces（ブラウザで開く開発用PC）を使う</h2>
<p>Codespaces（ブラウザで開く開発用PC）は、GitHub（ネット上のコード置き場）が貸してくれる開発環境。</p>
<ul>
<li>学校PCでも家のPCでも同じ環境になる</li>
<li>MacでもWindowsでも差が出にくい</li>
<li>Node.js（JavaScriptを動かす道具）などを自分で入れなくてよい</li>
<li>「自分のPCでは動くのに、相手のPCでは動かない」を減らせる</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-class="slides" data-theme="2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc" lang="C" class="slides" data-marpit-pagination="21" style="--paginate:true;--class:slides;--theme:2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc;" data-marpit-pagination-total="61">
<h2 id="codespaces%E3%83%96%E3%83%A9%E3%82%A6%E3%82%B6%E3%81%A7%E9%96%8B%E3%81%8F%E9%96%8B%E7%99%BA%E7%94%A8pc%E3%82%92%E8%B5%B7%E5%8B%95%E3%81%99%E3%82%8B">Codespaces（ブラウザで開く開発用PC）を起動する</h2>
<ol>
<li>GitHub（ネット上のコード置き場）でRepository（チームのコード箱）を開く</li>
<li>緑色のCode（コード操作メニュー）を押す</li>
<li>Codespaces（ブラウザで開く開発用PC）タブを開く</li>
<li>Create codespace on main（完成版の置き場から開発用PCを作る）を押す</li>
<li>ブラウザ上でVS Code（コードを書く画面）が開く</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-class="slides" data-theme="2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc" lang="C" class="slides" data-marpit-pagination="22" style="--paginate:true;--class:slides;--theme:2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc;" data-marpit-pagination-total="61">
<h2 id="codespaces%E3%83%96%E3%83%A9%E3%82%A6%E3%82%B6%E3%81%A7%E9%96%8B%E3%81%8F%E9%96%8B%E7%99%BA%E7%94%A8pc%E3%81%AF%E6%AD%A2%E3%82%81%E5%BF%98%E3%82%8C%E3%81%AB%E6%B3%A8%E6%84%8F">Codespaces（ブラウザで開く開発用PC）は止め忘れに注意</h2>
<p>Codespaces（ブラウザで開く開発用PC）は、開いたままだと利用時間を消費することがある。</p>
<ul>
<li>作業が終わったらStop（停止）する</li>
<li>次回は同じCodespaces（ブラウザで開く開発用PC）を再開できる</li>
<li>消してもGitHub（ネット上のコード置き場）にPush（ネット上のコード置き場へ送る）済みなら安全</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-marpit-scope-a3YkoVuO="" data-paginate="true" data-class="slides" data-theme="2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc" lang="C" class="slides" data-marpit-pagination="23" style="--paginate:true;--class:slides;--theme:2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc;" data-marpit-pagination-total="61">
<h1 id="%E8%87%AA%E5%88%86%E3%81%AE%E4%BD%9C%E6%A5%AD%E9%83%A8%E5%B1%8B%E3%82%92%E4%BD%9C%E3%82%8B">自分の作業部屋を作る</h1>
<div class="section-outline">
  <div class="outline-item outline-muted">GitHubを用意する</div>
  <div class="outline-item outline-muted">Codespacesを開く</div>
  <div class="outline-item outline-current">自分の作業部屋を作る</div>
  <div class="outline-item outline-muted">少しだけ変更して記録する</div>
  <div class="outline-item outline-muted">ネット上のコード置き場へ送る</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-class="slides" data-theme="2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc" lang="C" class="slides" data-marpit-pagination="24" style="--paginate:true;--class:slides;--theme:2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc;" data-marpit-pagination-total="61">
<h2 id="branch%E8%87%AA%E5%88%86%E5%B0%82%E7%94%A8%E3%81%AE%E5%AE%89%E5%85%A8%E3%81%AA%E4%BD%9C%E6%A5%AD%E9%83%A8%E5%B1%8B%E3%82%92%E4%BD%9C%E3%82%8B">Branch（自分専用の安全な作業部屋）を作る</h2>
<p>Branch（自分専用の安全な作業部屋）は、main（完成版の置き場）から分かれた自分用の作業場所。</p>
<ul>
<li>main（完成版の置き場）を直接壊さない</li>
<li>自分の担当だけ集中して作れる</li>
<li>失敗してもmain（完成版の置き場）には影響しない</li>
<li>完成したらPull Request / PR（合体前の確認依頼）で合体をお願いする</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-class="slides" data-theme="2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc" lang="C" class="slides" data-marpit-pagination="25" style="--paginate:true;--class:slides;--theme:2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc;" data-marpit-pagination-total="61">
<h2 id="vs-code%E3%82%B3%E3%83%BC%E3%83%89%E3%82%92%E6%9B%B8%E3%81%8F%E7%94%BB%E9%9D%A2%E3%81%8B%E3%82%89branch%E8%87%AA%E5%88%86%E5%B0%82%E7%94%A8%E3%81%AE%E5%AE%89%E5%85%A8%E3%81%AA%E4%BD%9C%E6%A5%AD%E9%83%A8%E5%B1%8B%E3%82%92%E4%BD%9C%E3%82%8B">VS Code（コードを書く画面）からBranch（自分専用の安全な作業部屋）を作る</h2>
<ol>
<li>左下のmain（完成版の置き場）をクリック</li>
<li>Create new branch（新しい作業部屋を作る）を選ぶ</li>
<li>作業内容がわかる名前をつける</li>
<li>左下の表示がmain（完成版の置き場）から新しい名前に変わったらOK</li>
</ol>
<p>例：<code>feature/top-page</code></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-class="slides" data-theme="2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc" lang="C" class="slides" data-marpit-pagination="26" style="--paginate:true;--class:slides;--theme:2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc;" data-marpit-pagination-total="61">
<h2 id="branch%E8%87%AA%E5%88%86%E5%B0%82%E7%94%A8%E3%81%AE%E5%AE%89%E5%85%A8%E3%81%AA%E4%BD%9C%E6%A5%AD%E9%83%A8%E5%B1%8B%E3%81%AE%E5%90%8D%E5%89%8D%E3%81%AF%E5%86%85%E5%AE%B9%E3%81%8C%E3%82%8F%E3%81%8B%E3%82%8B%E3%82%88%E3%81%86%E3%81%AB%E3%81%99%E3%82%8B">Branch（自分専用の安全な作業部屋）の名前は内容がわかるようにする</h2>
<p>よい名前：</p>
<ul>
<li><code>feature/top-page</code></li>
<li><code>feature/course-list</code></li>
<li><code>fix/header-layout</code></li>
</ul>
<p>よくない名前：</p>
<ul>
<li><code>aaa</code></li>
<li><code>test</code></li>
<li><code>my-branch</code></li>
</ul>
<p><strong>Branch（自分専用の安全な作業部屋）は「何をする場所か」が名前でわかるようにする。</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-marpit-scope-yOK7mm2a="" data-paginate="true" data-class="slides" data-theme="2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc" lang="C" class="slides" data-marpit-pagination="27" style="--paginate:true;--class:slides;--theme:2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc;" data-marpit-pagination-total="61">
<h1 id="%E5%B0%91%E3%81%97%E3%81%A0%E3%81%91%E5%A4%89%E6%9B%B4%E3%81%97%E3%81%A6%E8%A8%98%E9%8C%B2%E3%81%99%E3%82%8B">少しだけ変更して記録する</h1>
<div class="section-outline">
  <div class="outline-item outline-muted">Codespacesを開く</div>
  <div class="outline-item outline-muted">自分の作業部屋を作る</div>
  <div class="outline-item outline-current">少しだけ変更して記録する</div>
  <div class="outline-item outline-muted">ネット上のコード置き場へ送る</div>
  <div class="outline-item outline-muted">合体の確認依頼を出す</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-class="slides" data-theme="2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc" lang="C" class="slides" data-marpit-pagination="28" style="--paginate:true;--class:slides;--theme:2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc;" data-marpit-pagination-total="61">
<h2 id="commit%E5%A4%89%E6%9B%B4%E3%81%AE%E3%82%BB%E3%83%BC%E3%83%96%E3%83%9D%E3%82%A4%E3%83%B3%E3%83%88%E3%82%92%E4%BD%9C%E3%82%8B">Commit（変更のセーブポイント）を作る</h2>
<p>Commit（変更のセーブポイント）は、「ここまでの変更」をメモ付きで記録すること。</p>
<ul>
<li>ただファイル保存するだけではGit（変更履歴を残す道具）には記録されない</li>
<li>何を変えたかメモを残す</li>
<li>後から見たときに作業内容がわかる</li>
<li>戻したいときの目印になる</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-class="slides" data-theme="2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc" lang="C" class="slides" data-marpit-pagination="29" style="--paginate:true;--class:slides;--theme:2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc;" data-marpit-pagination-total="61">
<h2 id="%E3%83%86%E3%82%B9%E3%83%88%E3%81%A8%E3%81%97%E3%81%A6readme%E6%9C%80%E5%88%9D%E3%81%AE%E8%AA%AC%E6%98%8E%E3%83%95%E3%82%A1%E3%82%A4%E3%83%AB%E3%82%92%E5%B0%91%E3%81%97%E5%A4%89%E3%81%88%E3%82%8B">テストとしてREADME（最初の説明ファイル）を少し変える</h2>
<ol>
<li>左のファイル一覧からREADME.md（最初の説明ファイル）を開く</li>
<li>文字を少し足す</li>
<li>Source Control（変更を記録する画面）を開く</li>
<li>README.md（最初の説明ファイル）が変更一覧に出ていることを確認する</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-class="slides" data-theme="2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc" lang="C" class="slides" data-marpit-pagination="30" style="--paginate:true;--class:slides;--theme:2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc;" data-marpit-pagination-total="61">
<h2 id="commit%E5%A4%89%E6%9B%B4%E3%81%AE%E3%82%BB%E3%83%BC%E3%83%96%E3%83%9D%E3%82%A4%E3%83%B3%E3%83%88%E3%81%AB%E3%81%AF%E3%83%A1%E3%83%83%E3%82%BB%E3%83%BC%E3%82%B8%E3%82%92%E6%9B%B8%E3%81%8F">Commit（変更のセーブポイント）にはメッセージを書く</h2>
<ol>
<li>Source Control（変更を記録する画面）を開く</li>
<li>Message（変更メモ）に何をしたか書く</li>
<li>Commit（変更のセーブポイントを作る）を押す</li>
</ol>
<p>よいメッセージ：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">テストでREADMEに文字を追加
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-class="slides" data-theme="2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc" lang="C" class="slides" data-marpit-pagination="31" style="--paginate:true;--class:slides;--theme:2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc;" data-marpit-pagination-total="61">
<h2 id="commit%E5%A4%89%E6%9B%B4%E3%81%AE%E3%82%BB%E3%83%BC%E3%83%96%E3%83%9D%E3%82%A4%E3%83%B3%E3%83%88%E3%81%AE%E3%83%A1%E3%83%83%E3%82%BB%E3%83%BC%E3%82%B8%E3%81%AF%E5%85%B7%E4%BD%93%E7%9A%84%E3%81%AB%E3%81%99%E3%82%8B">Commit（変更のセーブポイント）のメッセージは具体的にする</h2>
<p>よい例：</p>
<ul>
<li>トップページを作成</li>
<li>授業一覧の仮データを追加</li>
<li>READMEにセットアップ手順を追加</li>
</ul>
<p>よくない例：</p>
<ul>
<li>修正</li>
<li>いろいろ</li>
<li>test</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-marpit-scope-KPQ7m1n1="" data-paginate="true" data-class="slides" data-theme="2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc" lang="C" class="slides" data-marpit-pagination="32" style="--paginate:true;--class:slides;--theme:2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc;" data-marpit-pagination-total="61">
<h1 id="%E3%83%8D%E3%83%83%E3%83%88%E4%B8%8A%E3%81%AE%E3%82%B3%E3%83%BC%E3%83%89%E7%BD%AE%E3%81%8D%E5%A0%B4%E3%81%B8%E9%80%81%E3%82%8B">ネット上のコード置き場へ送る</h1>
<div class="section-outline">
  <div class="outline-item outline-muted">自分の作業部屋を作る</div>
  <div class="outline-item outline-muted">少しだけ変更して記録する</div>
  <div class="outline-item outline-current">ネット上のコード置き場へ送る</div>
  <div class="outline-item outline-muted">合体の確認依頼を出す</div>
  <div class="outline-item outline-muted">Vue.jsで最初の画面を作る</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-class="slides" data-theme="2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc" lang="C" class="slides" data-marpit-pagination="33" style="--paginate:true;--class:slides;--theme:2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc;" data-marpit-pagination-total="61">
<h2 id="push%E3%83%8D%E3%83%83%E3%83%88%E4%B8%8A%E3%81%AE%E3%82%B3%E3%83%BC%E3%83%89%E7%BD%AE%E3%81%8D%E5%A0%B4%E3%81%B8%E9%80%81%E3%82%8B%E3%82%92%E3%81%99%E3%82%8B">Push（ネット上のコード置き場へ送る）をする</h2>
<p>Commit（変更のセーブポイント）は、まだ今開いているCodespaces（ブラウザで開く開発用PC）の中だけにある。</p>
<ul>
<li>GitHub（ネット上のコード置き場）へ送る必要がある</li>
<li>これをPush（ネット上のコード置き場へ送る）と呼ぶ</li>
<li>Push（ネット上のコード置き場へ送る）すると、チームメンバーも変更を見られる</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-class="slides" data-theme="2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc" lang="C" class="slides" data-marpit-pagination="34" style="--paginate:true;--class:slides;--theme:2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc;" data-marpit-pagination-total="61">
<h2 id="vs-code%E3%82%B3%E3%83%BC%E3%83%89%E3%82%92%E6%9B%B8%E3%81%8F%E7%94%BB%E9%9D%A2%E3%81%8B%E3%82%89push%E3%83%8D%E3%83%83%E3%83%88%E4%B8%8A%E3%81%AE%E3%82%B3%E3%83%BC%E3%83%89%E7%BD%AE%E3%81%8D%E5%A0%B4%E3%81%B8%E9%80%81%E3%82%8B%E3%81%99%E3%82%8B">VS Code（コードを書く画面）からPush（ネット上のコード置き場へ送る）する</h2>
<ol>
<li>Source Control（変更を記録する画面）を開く</li>
<li>Sync Changes（送る・受け取るをまとめて行う）を押す</li>
<li>GitHub（ネット上のコード置き場）にBranch（自分専用の安全な作業部屋）が作られる</li>
<li>GitHub（ネット上のコード置き場）で変更が見えるようになる</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-class="slides" data-theme="2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc" lang="C" class="slides" data-marpit-pagination="35" style="--paginate:true;--class:slides;--theme:2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc;" data-marpit-pagination-total="61">
<h2 id="%E3%82%B3%E3%83%9E%E3%83%B3%E3%83%89%E3%81%A7%E3%82%84%E3%82%8B%E5%A0%B4%E5%90%88%E3%81%AF%E3%81%93%E3%81%AE4%E3%81%A4">コマンドでやる場合はこの4つ</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">git switch -c feature/top-page
git add .
git commit -m <span class="hljs-string">&quot;トップページを作成&quot;</span>
git push -u origin feature/top-page
</code></pre>
<ul>
<li><code>git switch -c</code>：Branch（自分専用の安全な作業部屋）を作って移動</li>
<li><code>git add .</code>：Commit（変更のセーブポイント）に入れる変更を選ぶ</li>
<li><code>git commit</code>：Commit（変更のセーブポイント）を作る</li>
<li><code>git push</code>：Push（ネット上のコード置き場へ送る）する</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-marpit-scope-OHwLYTa8="" data-paginate="true" data-class="slides" data-theme="2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc" lang="C" class="slides" data-marpit-pagination="36" style="--paginate:true;--class:slides;--theme:2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc;" data-marpit-pagination-total="61">
<h1 id="%E5%90%88%E4%BD%93%E3%81%AE%E7%A2%BA%E8%AA%8D%E4%BE%9D%E9%A0%BC%E3%82%92%E5%87%BA%E3%81%99">合体の確認依頼を出す</h1>
<div class="section-outline">
  <div class="outline-item outline-muted">少しだけ変更して記録する</div>
  <div class="outline-item outline-muted">ネット上のコード置き場へ送る</div>
  <div class="outline-item outline-current">合体の確認依頼を出す</div>
  <div class="outline-item outline-muted">Vue.jsで最初の画面を作る</div>
  <div class="outline-item outline-muted">AIに手伝ってもらう</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-class="slides" data-theme="2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc" lang="C" class="slides" data-marpit-pagination="37" style="--paginate:true;--class:slides;--theme:2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc;" data-marpit-pagination-total="61">
<h2 id="pull-request--pr%E5%90%88%E4%BD%93%E5%89%8D%E3%81%AE%E7%A2%BA%E8%AA%8D%E4%BE%9D%E9%A0%BC%E3%82%92%E4%BD%9C%E3%82%8B">Pull Request / PR（合体前の確認依頼）を作る</h2>
<p>Pull Request / PR（合体前の確認依頼）は、</p>
<p><strong>「自分の作業をmain（完成版の置き場）に入れていいですか？」というお願い。</strong></p>
<ul>
<li>チームメンバーに変更を見てもらう</li>
<li>main（完成版の置き場）に入れる前に確認する</li>
<li>変な変更が混ざっていないか見る</li>
<li>問題なければMerge（完成版の置き場に合体）する</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-class="slides" data-theme="2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc" lang="C" class="slides" data-marpit-pagination="38" style="--paginate:true;--class:slides;--theme:2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc;" data-marpit-pagination-total="61">
<h2 id="github%E3%83%8D%E3%83%83%E3%83%88%E4%B8%8A%E3%81%AE%E3%82%B3%E3%83%BC%E3%83%89%E7%BD%AE%E3%81%8D%E5%A0%B4%E3%81%A7pull-request--pr%E5%90%88%E4%BD%93%E5%89%8D%E3%81%AE%E7%A2%BA%E8%AA%8D%E4%BE%9D%E9%A0%BC%E3%82%92%E4%BD%9C%E3%82%8B">GitHub（ネット上のコード置き場）でPull Request / PR（合体前の確認依頼）を作る</h2>
<ol>
<li>GitHub（ネット上のコード置き場）でRepository（チームのコード箱）を開く</li>
<li>Compare &amp; pull request（比べて確認依頼を作る）を押す</li>
<li>タイトルを書く</li>
<li>変更内容を書く</li>
<li>Create pull request（確認依頼を作る）を押す</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-class="slides" data-theme="2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc" lang="C" class="slides" data-marpit-pagination="39" style="--paginate:true;--class:slides;--theme:2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc;" data-marpit-pagination-total="61">
<h2 id="pull-request--pr%E5%90%88%E4%BD%93%E5%89%8D%E3%81%AE%E7%A2%BA%E8%AA%8D%E4%BE%9D%E9%A0%BC%E3%81%AB%E3%81%AF3%E3%81%A4%E3%82%92%E6%9B%B8%E3%81%8F">Pull Request / PR（合体前の確認依頼）には3つを書く</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-md"><span class="hljs-section">## 目的</span>
トップページを作成する

<span class="hljs-section">## 変更内容</span>
<span class="hljs-bullet">-</span> トップページ用の表示を追加
<span class="hljs-bullet">-</span> 仮の見出しと説明文を追加

<span class="hljs-section">## 確認方法</span>
<span class="hljs-bullet">-</span> 画面表示を確認
<span class="hljs-bullet">-</span> build（完成品として作れるか確認）が成功
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-class="slides" data-theme="2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc" lang="C" class="slides" data-marpit-pagination="40" style="--paginate:true;--class:slides;--theme:2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc;" data-marpit-pagination-total="61">
<h2 id="files-changed%E5%A4%89%E6%9B%B4%E5%B7%AE%E5%88%86%E3%81%AE%E7%A2%BA%E8%AA%8D%E7%94%BB%E9%9D%A2%E3%82%92%E8%A6%8B%E3%82%8B">Files changed（変更差分の確認画面）を見る</h2>
<p>Files changed（変更差分の確認画面）では、何が変わったかを確認できる。</p>
<ul>
<li>意図しないファイルを変えていないか</li>
<li>消してはいけないコードを消していないか</li>
<li>main（完成版の置き場）に入れてよい内容か</li>
<li>Conflict（変更の衝突）が起きていないか</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-class="slides" data-theme="2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc" lang="C" class="slides" data-marpit-pagination="41" style="--paginate:true;--class:slides;--theme:2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc;" data-marpit-pagination-total="61">
<h2 id="merge%E5%AE%8C%E6%88%90%E7%89%88%E3%81%AE%E7%BD%AE%E3%81%8D%E5%A0%B4%E3%81%AB%E5%90%88%E4%BD%93%E3%81%AF%E7%A2%BA%E8%AA%8D%E3%81%97%E3%81%A6%E3%81%8B%E3%82%89%E6%8A%BC%E3%81%99">Merge（完成版の置き場に合体）は確認してから押す</h2>
<p>Merge（完成版の置き場に合体）は、Pull Request / PR（合体前の確認依頼）の内容をmain（完成版の置き場）へ入れる操作。</p>
<ul>
<li>変更内容をチームで見る</li>
<li>build（完成品として作れるか確認）が通っているか見る</li>
<li>問題がなければMerge（完成版の置き場に合体）する</li>
</ul>
<p><strong>main（完成版の置き場）は発表に使う大事な場所。慎重に守る。</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-marpit-scope-oQKEZJ5r="" data-paginate="true" data-class="slides" data-theme="2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc" lang="C" class="slides" data-marpit-pagination="42" style="--paginate:true;--class:slides;--theme:2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc;" data-marpit-pagination-total="61">
<h1 id="vuejs%E3%81%A7%E6%9C%80%E5%88%9D%E3%81%AE%E7%94%BB%E9%9D%A2%E3%82%92%E4%BD%9C%E3%82%8B">Vue.jsで最初の画面を作る</h1>

<h2 id="%E6%8A%80%E8%A1%93%E3%82%B9%E3%82%BF%E3%83%83%E3%82%AF%E4%BD%BF%E3%81%86%E9%81%93%E5%85%B7%E3%81%AE%E7%B5%84%E3%81%BF%E5%90%88%E3%82%8F%E3%81%9B%E3%82%92%E6%B1%BA%E3%82%81%E3%82%8B">技術スタック（使う道具の組み合わせ）を決める</h2>
<p>技術スタック（使う道具の組み合わせ）は、アプリを作るために使う道具セット。</p>
<ul>
<li>Vue.js（画面を作る道具）</li>
<li>TypeScript（ミスに気づきやすいJavaScript）</li>
<li>Firebase（ログインやデータ保存を助けるサービス）</li>
<li>Vercel（Webアプリを公開するサービス）</li>
</ul>
<p>迷ったら、まずはこの組み合わせでよい。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-class="slides" data-theme="2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc" lang="C" class="slides" data-marpit-pagination="44" style="--paginate:true;--class:slides;--theme:2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc;" data-marpit-pagination-total="61">
<h2 id="vuejs%E7%94%BB%E9%9D%A2%E3%82%92%E4%BD%9C%E3%82%8B%E9%81%93%E5%85%B7%E3%81%AE%E3%83%97%E3%83%AD%E3%82%B8%E3%82%A7%E3%82%AF%E3%83%88%E3%82%92%E4%BD%9C%E3%82%8B">Vue.js（画面を作る道具）のプロジェクトを作る</h2>
<p>Codespaces（ブラウザで開く開発用PC）のTerminal（文字で操作する場所）で実行する。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-built_in">mkdir</span> frontend
<span class="hljs-built_in">cd</span> frontend
npm create vue@latest .
npm install
npm run dev
</code></pre>
<ul>
<li>npm（JavaScriptの道具箱を管理するコマンド）を使う</li>
<li><code>npm run dev</code> は開発用の画面を起動するコマンド</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-class="slides" data-theme="2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc" lang="C" class="slides" data-marpit-pagination="45" style="--paginate:true;--class:slides;--theme:2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc;" data-marpit-pagination-total="61">
<h2 id="%E6%9C%80%E5%88%9D%E3%81%AF%E8%A6%8B%E3%82%8B%E5%A0%B4%E6%89%80%E3%82%92%E7%B5%9E%E3%82%8B">最初は見る場所を絞る</h2>
<p>Vue.js（画面を作る道具）のファイルは多いので、最初はここだけ見る。</p>
<ul>
<li><code>src/views</code>：ページ全体を置く場所</li>
<li><code>src/components</code>：画面の部品を置く場所</li>
<li><code>App.vue</code>：アプリ全体の土台</li>
<li><code>main.ts</code>：アプリを起動する場所</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-class="slides" data-theme="2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc" lang="C" class="slides" data-marpit-pagination="46" style="--paginate:true;--class:slides;--theme:2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc;" data-marpit-pagination-total="61">
<h2 id="build%E5%AE%8C%E6%88%90%E5%93%81%E3%81%A8%E3%81%97%E3%81%A6%E4%BD%9C%E3%82%8C%E3%82%8B%E3%81%8B%E7%A2%BA%E8%AA%8D%E3%82%92%E9%80%9A%E3%81%99">build（完成品として作れるか確認）を通す</h2>
<p>build（完成品として作れるか確認）は、発表や公開に向けてアプリが正しく作れるか確認する操作。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">npm run build
</code></pre>
<ul>
<li>エラーが出たら、まずエラー文を読む</li>
<li>AI（相談役の自動補助ツール）に聞くときはエラー文も貼る</li>
<li>build（完成品として作れるか確認）が通ってからPull Request / PR（合体前の確認依頼）を出す</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-marpit-scope-PneqAH55="" data-paginate="true" data-class="slides" data-theme="2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc" lang="C" class="slides" data-marpit-pagination="47" style="--paginate:true;--class:slides;--theme:2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc;" data-marpit-pagination-total="61">
<h1 id="ai%E3%81%AB%E6%89%8B%E4%BC%9D%E3%81%A3%E3%81%A6%E3%82%82%E3%82%89%E3%81%86">AIに手伝ってもらう</h1>

<h2 id="ai%E7%9B%B8%E8%AB%87%E5%BD%B9%E3%81%AE%E8%87%AA%E5%8B%95%E8%A3%9C%E5%8A%A9%E3%83%84%E3%83%BC%E3%83%AB%E3%81%AB%E3%81%AF%E3%81%84%E3%81%8D%E3%81%AA%E3%82%8A%E5%85%A8%E9%83%A8%E4%BD%9C%E3%82%89%E3%81%9B%E3%81%AA%E3%81%84">AI（相談役の自動補助ツール）には、いきなり全部作らせない</h2>
<p>AI（相談役の自動補助ツール）には、まず計画を出してもらう。</p>
<ul>
<li>MVP（最小限だけど価値が伝わる形）を伝える</li>
<li>変更するファイルを提案してもらう</li>
<li>先に手順を説明してもらう</li>
<li>build（完成品として作れるか確認）が通るように依頼する</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-class="slides" data-theme="2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc" lang="C" class="slides" data-marpit-pagination="49" style="--paginate:true;--class:slides;--theme:2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc;" data-marpit-pagination-total="61">
<h2 id="ai%E7%9B%B8%E8%AB%87%E5%BD%B9%E3%81%AE%E8%87%AA%E5%8B%95%E8%A3%9C%E5%8A%A9%E3%83%84%E3%83%BC%E3%83%AB%E3%81%B8%E3%81%AE%E4%BE%9D%E9%A0%BC%E6%96%87%E3%81%AB%E3%81%AF%E7%9B%AE%E7%9A%84%E3%83%BB%E5%88%B6%E7%B4%84%E3%83%BB%E7%A2%BA%E8%AA%8D%E6%96%B9%E6%B3%95%E3%82%92%E6%9B%B8%E3%81%8F">AI（相談役の自動補助ツール）への依頼文には目的・制約・確認方法を書く</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Week2で作るMVP（最小限だけど価値が伝わる形）は
「授業一覧 → 授業詳細 → コメント表示」です。

お願い：
1. まず既存ファイル構成を確認してください。
2. すぐ実装せず、変更するファイルと手順を提案してください。
3. 初心者にもわかる説明でお願いします。
4. 最後に npm run build が通るようにしてください。
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-class="slides" data-theme="2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc" lang="C" class="slides" data-marpit-pagination="50" style="--paginate:true;--class:slides;--theme:2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc;" data-marpit-pagination-total="61">
<h2 id="ai%E7%9B%B8%E8%AB%87%E5%BD%B9%E3%81%AE%E8%87%AA%E5%8B%95%E8%A3%9C%E5%8A%A9%E3%83%84%E3%83%BC%E3%83%AB%E3%81%8C%E4%BD%9C%E3%81%A3%E3%81%9F%E5%A4%89%E6%9B%B4%E3%82%82%E4%BA%BA%E9%96%93%E3%81%8C%E7%A2%BA%E8%AA%8D%E3%81%99%E3%82%8B">AI（相談役の自動補助ツール）が作った変更も人間が確認する</h2>
<ul>
<li>Files changed（変更差分の確認画面）を見る</li>
<li>変なファイルが増えていないか確認する</li>
<li>目的と違う実装をしていないか確認する</li>
<li>build（完成品として作れるか確認）を実行する</li>
</ul>
<p>AI（相談役の自動補助ツール）は便利だが、最後に判断するのは人間。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-marpit-scope-lr5TrsFa="" data-paginate="true" data-class="slides" data-theme="2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc" lang="C" class="slides" data-marpit-pagination="51" style="--paginate:true;--class:slides;--theme:2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc;" data-marpit-pagination-total="61">

<h2 id="%E8%A9%B0%E3%81%BE%E3%81%A3%E3%81%9F%E3%82%89%E6%83%85%E5%A0%B1%E3%82%92%E3%81%9D%E3%82%8D%E3%81%88%E3%81%A6%E7%9B%B8%E8%AB%87%E3%81%99%E3%82%8B">詰まったら情報をそろえて相談する</h2>
<p>相談するときは、次の3つを出す。</p>
<ol>
<li>何をしようとしたか</li>
<li>どんなエラーが出たか</li>
<li>画面のスクショ</li>
</ol>
<ul>
<li>Codespaces（ブラウザで開く開発用PC）の画面</li>
<li>Terminal（文字で操作する場所）のエラー文</li>
<li>GitHub（ネット上のコード置き場）のPull Request / PR（合体前の確認依頼）画面</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-class="slides" data-theme="2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc" lang="C" class="slides" data-marpit-pagination="53" style="--paginate:true;--class:slides;--theme:2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc;" data-marpit-pagination-total="61">
<h2 id="conflict%E5%A4%89%E6%9B%B4%E3%81%AE%E8%A1%9D%E7%AA%81%E3%81%AF%E5%A4%B1%E6%95%97%E3%81%A7%E3%81%AF%E3%81%AA%E3%81%84">Conflict（変更の衝突）は失敗ではない</h2>
<p>Conflict（変更の衝突）は、同じ場所を複数人が変えたため、Git（変更履歴を残す道具）が自動で決められない状態。</p>
<ul>
<li>「どちらを残すか」を人間が選ぶ</li>
<li>早めにチームへ共有する</li>
<li>大きすぎるPull Request / PR（合体前の確認依頼）を避けると起きにくい</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-class="slides" data-theme="2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc" lang="C" class="slides" data-marpit-pagination="54" style="--paginate:true;--class:slides;--theme:2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc;" data-marpit-pagination-total="61">
<h2 id="1%E5%9B%9E%E3%81%AEpull-request--pr%E5%90%88%E4%BD%93%E5%89%8D%E3%81%AE%E7%A2%BA%E8%AA%8D%E4%BE%9D%E9%A0%BC%E3%81%AF%E5%B0%8F%E3%81%95%E3%81%8F%E3%81%99%E3%82%8B">1回のPull Request / PR（合体前の確認依頼）は小さくする</h2>
<p>大きすぎるPull Request / PR（合体前の確認依頼）は確認しづらい。</p>
<ul>
<li>1画面だけ</li>
<li>1機能だけ</li>
<li>1つの修正だけ</li>
</ul>
<p><strong>「何を変えたか説明できる大きさ」にする。</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-marpit-scope-7NhroSx1="" data-paginate="true" data-class="slides" data-theme="2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc" lang="C" class="slides" data-marpit-pagination="55" style="--paginate:true;--class:slides;--theme:2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc;" data-marpit-pagination-total="61">

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-class="slides" data-theme="2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc" lang="C" class="slides" data-marpit-pagination="56" style="--paginate:true;--class:slides;--theme:2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc;" data-marpit-pagination-total="61">
<h2 id="week-2%E3%83%81%E3%82%A7%E3%83%83%E3%82%AF%E3%83%AA%E3%82%B9%E3%83%88">Week 2チェックリスト</h2>
<ul>
<li>GitHub（ネット上のコード置き場）のアカウントを作った</li>
<li>Repository（チームのコード箱）を作った</li>
<li>Collaborator（共同編集できる人）に全員を招待した</li>
<li>Codespaces（ブラウザで開く開発用PC）を開けた</li>
<li>MVP（最小限だけど価値が伝わる形）を1つに絞った</li>
<li>Branch（自分専用の安全な作業部屋）を作った</li>
<li>Commit（変更のセーブポイント）を作った</li>
<li>Push（ネット上のコード置き場へ送る）した</li>
<li>Pull Request / PR（合体前の確認依頼）を作った</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-class="slides" data-theme="2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc" lang="C" class="slides" data-marpit-pagination="57" style="--paginate:true;--class:slides;--theme:2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc;" data-marpit-pagination-total="61">
<h2 id="week-3%E3%81%B8%E3%81%A4%E3%81%AA%E3%81%92%E3%82%8B">Week 3へつなげる</h2>
<p>Week 3では、Pull Request / PR（合体前の確認依頼）を起点にMVP（最小限だけど価値が伝わる形）を育てる。</p>
<ul>
<li>バグを直す</li>
<li>画面を増やす</li>
<li>データをつなぐ</li>
<li>発表で見せる流れを作る</li>
</ul>
<p><strong>完成度よりも、チームで安全に開発する流れを身につける。</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-marpit-scope-gIjLn2UX="" data-paginate="true" data-class="slides" data-theme="2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc" lang="C" class="slides" data-marpit-pagination="58" style="--paginate:true;--class:slides;--theme:2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc;" data-marpit-pagination-total="61">

<div class="section-outline">
  <div class="outline-item outline-muted">よくある詰まりポイント</div>
  <div class="outline-item outline-muted">最後の確認</div>
  <div class="outline-item outline-current">補足</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-paginate="true" data-class="slides" data-theme="2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc" lang="C" class="slides" data-marpit-pagination="59" style="--paginate:true;--class:slides;--theme:2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc;" data-marpit-pagination-total="61">
<h2 id="devcontainer%E9%96%8B%E7%99%BA%E7%94%A8pc%E3%81%AE%E5%88%9D%E6%9C%9F%E8%A8%AD%E5%AE%9A%E3%82%92%E8%87%AA%E5%8B%95%E5%8C%96%E3%81%99%E3%82%8B%E4%BB%95%E7%B5%84%E3%81%BF%E3%81%AF%E4%BB%BB%E6%84%8F">devcontainer（開発用PCの初期設定を自動化する仕組み）は任意</h2>
<p>devcontainer（開発用PCの初期設定を自動化する仕組み）は、Codespaces（ブラウザで開く開発用PC）を作るときの準備を自動化する設定。</p>
<ul>
<li>毎回npm install（必要な道具を入れる操作）を手動でやらなくてよくなる</li>
<li>VS Code（コードを書く画面）の拡張機能も自動で入れられる</li>
<li>最初は知らなくても開発できる</li>
<li>余裕があるチームだけ使えばよい</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-paginate="true" data-class="slides" data-theme="2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc" lang="C" class="slides" data-marpit-pagination="60" style="--paginate:true;--class:slides;--theme:2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc;" data-marpit-pagination-total="61">
<h2 id="%E7%94%A8%E8%AA%9E%E3%81%A8%E8%A8%80%E3%81%84%E6%8F%9B%E3%81%88%E4%B8%80%E8%A6%A7">用語と言い換え一覧</h2>

<tr>
<td>GitHub</td>
<td>ネット上のコード置き場</td>
</tr>
<tr>
<td>Repository</td>
<td>チームのコード箱</td>
</tr>
<tr>
<td>Codespaces</td>
<td>ブラウザで開く開発用PC</td>
</tr>
<tr>
<td>main</td>
<td>完成版の置き場</td>
</tr>
<tr>
<td>Branch</td>

</tr>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-paginate="true" data-class="slides" data-theme="2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc" lang="C" class="slides" data-marpit-pagination="61" style="--paginate:true;--class:slides;--theme:2sl5i0vpq5cpefeomizu1fx65bqsennc6junc86zgc;" data-marpit-pagination-total="61">
<h2 id="%E4%BB%8A%E6%97%A5%E3%81%AE%E3%81%BE%E3%81%A8%E3%82%81">今日のまとめ</h2>
<ul>
<li>Git（変更履歴を残す道具）は、チームで安全に分担するために使う</li>
<li>GitHub（ネット上のコード置き場）は、チームのコードを共有する場所</li>
<li>Codespaces（ブラウザで開く開発用PC）は、全員の環境をそろえる場所</li>
<li>Branch（自分専用の安全な作業部屋）で作業し、Pull Request / PR（合体前の確認依頼）でmain（完成版の置き場）に入れる</li>
</ul>
<p><strong>小さく作って、確認して、共有する。</strong></p>
</section>
